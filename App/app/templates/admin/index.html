{% extends 'base.html' %}
{% block title %}Admin — LangCenter{% endblock %}

{% block content %}
<h1>Admin panel</h1>

<div class="features" style="margin-top:1.5rem;">
    <div class="feature-card">
        <h3>{{ stats.users }}</h3>
        <p>Users</p>
        <a href="{{ url_for('admin.users') }}" class="btn btn--sm" style="margin-top:.75rem;">Manage</a>
    </div>
    <div class="feature-card">
        <h3>{{ stats.courses }}</h3>
        <p>Courses</p>
        <a href="{{ url_for('admin.courses') }}" class="btn btn--sm" style="margin-top:.75rem;">Manage</a>
    </div>
    <div class="feature-card">
        <h3>{{ stats.lessons }}</h3>
        <p>Lessons</p>
        <a href="{{ url_for('admin.lessons') }}" class="btn btn--sm" style="margin-top:.75rem;">Manage</a>
    </div>
    <div class="feature-card">
        <h3>{{ stats.requests }}</h3>
        <p>Pending teacher requests</p>
        <a href="{{ url_for('admin.teacher_requests') }}" class="btn btn--sm" style="margin-top:.75rem;">Review</a>
    </div>
</div>
{% endblock %}
