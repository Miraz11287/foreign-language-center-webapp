{% extends 'base.html' %}
{% block title %}500 — Server error{% endblock %}
{% block content %}
<div style="text-align:center;padding:5rem 1rem;">
    <h1 style="font-size:6rem;line-height:1;color:var(--border);">500</h1>

{% endblock %}
